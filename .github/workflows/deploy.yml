name: Deploy Ecommerce App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate EC2 SSH secrets
        run: |
          test -n "${{ secrets.EC2_HOST }}" || { echo "EC2_HOST is missing"; exit 1; }
          test -n "${{ secrets.EC2_USER }}" || { echo "EC2_USER is missing"; exit 1; }
          test -n "${{ secrets.EC2_SSH_KEY }}" || { echo "EC2_SSH_KEY is missing"; exit 1; }

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            mkdir -p ~/ecommerce-3tier-app
            cd ~/ecommerce-3tier-app
            git pull origin main
            docker compose down
            docker compose up -d --build
