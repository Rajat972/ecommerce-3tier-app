version: '3.8'

services:
  # Tier 3: Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Tier 2: Backend API
  backend:
    build: ./backend
    environment:
      DB_USER: postgres
      DB_HOST: db
      DB_NAME: ecommerce
      DB_PASSWORD: password
      DB_PORT: 5432
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: unless-stopped

  # Tier 1: Frontend Web Server
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
